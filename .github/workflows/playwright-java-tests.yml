name: Playwright Java Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      browser:
        description: Browser to test
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - edge
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  manual-test:
    name: Manual - ${{ inputs.environment }} / ${{ inputs.browser }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
      RP_PROJECT: ${{ secrets.RP_PROJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install Playwright browsers
        run: ./gradlew installPlaywrightBrowsers

      - name: Run tests with ReportPortal
        if: ${{ env.RP_API_KEY != '' }}
        env:
          RP_LAUNCH: Playwright Demo Gradle - ${{ inputs.environment }} / ${{ inputs.browser }}
        run: ./gradlew clean test -Denv=${{ inputs.environment }} -Dbrowser=${{ inputs.browser }} -Dheadless=true -Drp.enabled=true -Drp.endpoint="${RP_ENDPOINT}" -Drp.api.key="${RP_API_KEY}" -Drp.project="${RP_PROJECT}" -Drp.launch="${RP_LAUNCH}" --rerun-tasks

      - name: Run tests without ReportPortal
        if: ${{ env.RP_API_KEY == '' }}
        run: ./gradlew clean test -Denv=${{ inputs.environment }} -Dbrowser=${{ inputs.browser }} -Dheadless=true --rerun-tasks

      - name: Verify Extent report
        if: always()
        run: |
          report="test-output/${{ inputs.environment }}/${{ inputs.browser }}/ExtentReport.html"
          if [ -f "$report" ]; then
            echo "Extent report found: $report"
          else
            echo "Extent report was not generated: $report"
            find test-output -maxdepth 5 -type f -print 2>/dev/null || true
          fi

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ inputs.environment }}-${{ inputs.browser }}
          path: |
            test-output/${{ inputs.environment }}/${{ inputs.browser }}/ExtentReport.html
            test-output/${{ inputs.environment }}/${{ inputs.browser }}/screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ inputs.environment }}-${{ inputs.browser }}
          path: test-output/${{ inputs.environment }}/${{ inputs.browser }}/traces/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report-${{ inputs.environment }}-${{ inputs.browser }}
          path: build/${{ inputs.environment }}/${{ inputs.browser }}/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

  matrix-test:
    name: Matrix - ${{ matrix.environment }} / ${{ matrix.browser }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
      RP_PROJECT: ${{ secrets.RP_PROJECT }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            browser: chromium
          - environment: staging
            browser: firefox
          - environment: prod
            browser: webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install Playwright browsers
        run: ./gradlew installPlaywrightBrowsers

      - name: Run tests with ReportPortal
        if: ${{ env.RP_API_KEY != '' }}
        env:
          RP_LAUNCH: Playwright Demo Gradle - ${{ matrix.environment }} / ${{ matrix.browser }}
        run: ./gradlew clean test -Denv=${{ matrix.environment }} -Dbrowser=${{ matrix.browser }} -Dheadless=true -Drp.enabled=true -Drp.endpoint="${RP_ENDPOINT}" -Drp.api.key="${RP_API_KEY}" -Drp.project="${RP_PROJECT}" -Drp.launch="${RP_LAUNCH}" --rerun-tasks

      - name: Run tests without ReportPortal
        if: ${{ env.RP_API_KEY == '' }}
        run: ./gradlew clean test -Denv=${{ matrix.environment }} -Dbrowser=${{ matrix.browser }} -Dheadless=true --rerun-tasks

      - name: Verify Extent report
        if: always()
        run: |
          report="test-output/${{ matrix.environment }}/${{ matrix.browser }}/ExtentReport.html"
          if [ -f "$report" ]; then
            echo "Extent report found: $report"
          else
            echo "Extent report was not generated: $report"
            find test-output -maxdepth 5 -type f -print 2>/dev/null || true
          fi

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.environment }}-${{ matrix.browser }}
          path: |
            test-output/${{ matrix.environment }}/${{ matrix.browser }}/ExtentReport.html
            test-output/${{ matrix.environment }}/${{ matrix.browser }}/screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.environment }}-${{ matrix.browser }}
          path: test-output/${{ matrix.environment }}/${{ matrix.browser }}/traces/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report-${{ matrix.environment }}-${{ matrix.browser }}
          path: build/${{ matrix.environment }}/${{ matrix.browser }}/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

  publish-extent-report:
    name: Publish Extent Report
    if: >
      always() &&
      github.event_name != 'pull_request' &&
      (needs.manual-test.result == 'success' ||
       needs.manual-test.result == 'failure' ||
       needs.matrix-test.result == 'success' ||
       needs.matrix-test.result == 'failure')
    needs:
      - manual-test
      - matrix-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download Extent reports
        uses: actions/download-artifact@v4
        with:
          pattern: extent-report-*
          path: pages
          merge-multiple: false

      - name: Create report index
        shell: bash
        run: |
          set -euo pipefail

          reports_found=false
          mkdir -p pages

          while IFS= read -r report; do
            reports_found=true
            break
          done < <(find pages -type f -name ExtentReport.html -print)

          if [ "$reports_found" = false ]; then
            echo "No Extent reports were downloaded."
            find pages -maxdepth 5 -type f -print || true
            exit 1
          fi

          {
            echo '<!doctype html>'
            echo '<html><head><meta charset="UTF-8"><title>Playwright Extent Reports</title></head><body>'
            echo '<h1>Playwright Extent Reports</h1><ul>'

            while IFS= read -r report; do
              relative="${report#pages/}"
              link="${relative// /%20}"
              label="${relative%/ExtentReport.html}"
              echo "<li><a href=\"${link}\">${label}</a></li>"
            done < <(find pages -type f -name ExtentReport.html -print | sort)

            echo '</ul></body></html>'
          } > pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to summary
        run: |
          echo "### Open Extent Report" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the Extent report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
