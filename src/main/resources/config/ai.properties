# JeshlaQaAiAgent Configuration
# AI-powered test automation agent configuration

# ============================================================
# AI CORE SETTINGS
# ============================================================

# Enable/disable AI features
ai.enabled=true

# AI Provider: ollama, huggingface, openai, anthropic
ai.provider=ollama

# ============================================================
# OLLAMA CONFIGURATION (Local Free LLM)
# ============================================================

# Ollama base URL (default: http://localhost:11434)
ai.ollama.base.url=http://localhost:11434

# Ollama model to use (llama3.2, mistral, codellama, etc.)
ai.ollama.model=llama3.2

# Ollama timeout in seconds
ai.ollama.timeout=120

# ============================================================
# HUGGING FACE CONFIGURATION (Free API)
# ============================================================

# Hugging Face API token (optional for some models)
ai.huggingface.api.token=

# Hugging Face model (for text generation)
ai.huggingface.model=gpt2

# ============================================================
# EMBEDDING CONFIGURATION
# ============================================================

# Embedding provider: sentence-transformers, huggingface, openai
ai.embedding.provider=sentence-transformers

# Embedding model (all-MiniLM-L6-v2 is fast and good quality)
ai.embedding.model=all-MiniLM-L6-v2

# Embedding dimensions
ai.embedding.dimensions=384

# ============================================================
# VECTOR STORE CONFIGURATION (RAG)
# ============================================================

# Vector store provider: chromadb, faiss, pinecone
ai.vector.store.provider=chromadb

# ChromaDB URL (if using remote)
ai.vector.store.chromadb.url=http://localhost:8000

# Local vector store path
ai.vector.store.path=./ai-knowledge

# ============================================================
# RAG CONFIGURATION
# ============================================================

# Enable/disable RAG (Retrieval-Augmented Generation)
ai.rag.enabled=true

# Number of relevant documents to retrieve
ai.rag.top.k=5

# RAG similarity threshold
ai.rag.similarity.threshold=0.7

# ============================================================
# REASONING STRATEGY
# ============================================================

# Reasoning strategy: cot (Chain of Thought), react, none
ai.reasoning.strategy=react

# Max reasoning steps
ai.reasoning.max.steps=5

# ============================================================
# AGENT CONFIGURATION
# ============================================================

# Enable/disable specific agents
ai.agent.test.generation.enabled=true
ai.agent.self.healing.enabled=true
ai.agent.triage.enabled=true
ai.agent.optimization.enabled=true

# ============================================================
# SELF-HEALING CONFIGURATION
# ============================================================

# Max attempts to heal a failing selector
ai.self.healing.max.attempts=3

# Confidence threshold for auto-applying healing
ai.self.healing.confidence.threshold=0.8

# ============================================================
# TEST GENERATION CONFIGURATION
# ============================================================

# Number of scenarios to generate per requirement
ai.test.generation.max.scenarios=10

# Include edge cases in generation
ai.test.generation.include.edge.cases=true

# Include negative test cases
ai.test.generation.include.negative=true

# ============================================================
# TRIAGE CONFIGURATION
# ============================================================

# Enable visual analysis in triage
ai.triage.visual.analysis.enabled=true

# Confidence threshold for triage classification
ai.triage.confidence.threshold=0.7

# ============================================================
# PERFORMANCE CONFIGURATION
# ============================================================

# Cache embeddings to improve performance
ai.cache.embeddings=true

# Cache path
ai.cache.path=./ai-cache

# Async AI calls (non-blocking)
ai.async.enabled=true

# ============================================================
# LOGGING CONFIGURATION
# ============================================================

# AI logging level: DEBUG, INFO, WARN, ERROR
ai.logging.level=INFO

# Log AI prompts and responses
ai.logging.prompts=false

# Log AI reasoning steps
ai.logging.reasoning=true

# ============================================================
# FALLBACK CONFIGURATION
# ============================================================

# Fallback to manual operations if AI fails
ai.fallback.to.manual=true

# AI failure retry count
ai.retry.count=2

# AI retry delay in seconds
ai.retry.delay=5
